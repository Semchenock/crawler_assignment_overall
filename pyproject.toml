[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "crawler-assignment-overall"
version = "0.1.0"
description = "Crawler assignment overall"
authors = [
    { name = "Semchenok Vsevolod" }
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "aiohttp>=3.9.5",
    "aiofiles>=24.1.0",
    "aiosqlite>=0.22.1",
    "beautifulsoup4>=4.12.3",
    "lxml>=5.2.1",
    "pandas>=3.0.2",
    "plotly>=6.7.0",
    "pyyaml>=6.0.3",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
