[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "crawler-assignment-overall"
version = "0.1.0"
description = "Crawler assignment overall"
authors = [
    { name = "Semchenok Vsevolod" }
]
readme = "README.md"
requires-python = ">=3.10"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]